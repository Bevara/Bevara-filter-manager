<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, sans-serif; background: #111; color: #ddd; }
    p { max-width: 36em; padding: 0 16px; }
    code { color: #fff; }
  </style>
</head>
<body>
  <p id="status">Installing the player for <code>{{package}}</code>…</p>
  <script>
    /* Opens {{package}} through the service worker that serves the page and
     * the modules packaged inside it (bevara preserve). Served over http(s):
     * service workers do not run from file://. */
    const status = document.getElementById('status');
    const target = new URL({{packageJson}}, location.href).href;
    if (!('serviceWorker' in navigator)) {
      status.textContent = 'This browser has no service workers: it cannot open the preserved file.';
    } else {
      navigator.serviceWorker.register('./bevara-sw.js', { type: 'module' })
        .then(() => navigator.serviceWorker.ready)
        .then(() => location.replace(target))
        .catch((e) => { status.textContent = `The service worker could not be installed: ${e.message}`; });
    }
  </script>
</body>
</html>
