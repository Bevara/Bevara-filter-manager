<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage image JXL</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-width: 650px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.1);
            margin-top: 15px;
        }
        .info {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Visionneuse JXL</h1>
        
        <!-- Remplacez "mon-image.jxl" par le nom exact de votre fichier -->
        <img src="zoltan-tasi-CLJeQCr2F_A-unsplash.jxl" alt="Mon image JPEG XL" id="jxlImage" is="universal-img_1" using="solver_minimal_1" with="libjxl_1">
        
        <div class="info" id="status">
            Votre navigateur doit prendre en charge le format JXL pour l'afficher correctement.
        </div>
    </div>

    <script>
        const img = document.getElementById('jxlImage');
        const status = document.getElementById('status');

        // Détection basique si l'image refuse de s'afficher
        img.onerror = function() {
            status.innerHTML = "<span style='color: #ef4444;'>Erreur : Impossible de charger l'image. Vérifiez le nom du fichier ou assurez-vous que votre navigateur supporte nativement le format .jxl.</span>";
        };
    </script>

<script src="scripts/universal-img_1.js"></script>
</body>
</html>
