# Dedicated host (like jenkins.bevara.ddns.net). cert-manager issues the
# certificate through the existing "lets-encrypt" ClusterIssuer.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bevara-registry-ingress
  annotations:
    cert-manager.io/cluster-issuer: lets-encrypt
    nginx.ingress.kubernetes.io/proxy-body-size: "256m"     # publish uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  tls:
    - hosts:
        - registry.bevara.ddns.net
      secretName: bevara-registry-ingress-tls
  rules:
    - host: registry.bevara.ddns.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bevara-registry
                port:
                  number: 80
