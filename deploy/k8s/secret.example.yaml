# Copy to secret.yaml (git-ignored), fill in, then: microk8s kubectl apply -f secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: bevara-registry-secrets
type: Opaque
stringData:
  # Local admin account created on first start (harmless once it exists).
  BOOTSTRAP_ADMIN_USER: admin
  BOOTSTRAP_ADMIN_PASSWORD: change-me-now
  # Single sign-on through Casdoor (https://bevara-auth.ddns.net). Create an
  # application in Casdoor with redirect URL
  #   https://registry.bevara.ddns.net/-/login/web/callback
  # and paste its client id/secret. Leave empty to use local accounts only.
  OIDC_ISSUER: https://bevara-auth.ddns.net
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  # Client ids of the Casdoor applications whose access tokens may read the
  # usage statistics (/-/admin/*): the administrators' dashboard's
  # (https://dashboard.bevara.ddns.net, see SDK/dashboard). Comma-separated.
  ADMIN_OIDC_AUDIENCES: ""
